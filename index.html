*{box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:#0F172A;margin:0;overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#EDF1F7;border-radius:99px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:99px;border:3px solid #EDF1F7}

*{scrollbar-width:thin;scrollbar-color:var(--gold) #EDF1F7}
.dark-scroll::-webkit-scrollbar-track{background:#0F1A2E}
.dark-scroll::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#3B4C6B,#22314C);border-color:#0F1A2E}
.fade{animation:fade .28s cubic-bezier(.2,.7,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .22s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.slidein{animation:slidein .3s cubic-bezier(.2,.8,.25,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.sheetin{animation:sheet .3s cubic-bezier(.2,.8,.25,1) both}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.stagger>*{animation:fade .34s cubic-bezier(.2,.7,.3,1) both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.05s}
.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.11s}
.stagger>*:nth-child(5){animation-delay:.14s}.stagger>*:nth-child(6){animation-delay:.17s}

input,textarea,select,button{font-family:inherit}
input,textarea,select{transition:box-shadow .16s,border-color .16s}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.7rem;font-weight:600;transition:transform .12s,box-shadow .16s,background .16s;cursor:pointer;border:1px solid transparent}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ink{background:linear-gradient(135deg,var(--ink2),var(--ink));color:#fff;box-shadow:0 6px 18px -8px rgba(11,18,32,.8)}
.btn-ink:hover:not(:disabled){box-shadow:0 10px 26px -10px rgba(11,18,32,.9)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2A2205;box-shadow:0 6px 18px -8px rgba(212,175,55,.9)}
.btn-ghost{background:#fff;border-color:var(--line);color:#334155}
.btn-ghost:hover:not(:disabled){background:#F8FAFC;border-color:#CBD5E1}
.btn-danger{background:#FFF1F4;color:var(--danger);border-color:#FBD5DE}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:99px;font-size:11px;font-weight:700;padding:.22rem .6rem;border:1px solid transparent;white-space:nowrap}

.cal-row{display:contents}
.cal-corner{position:sticky;top:0;left:0;z-index:6;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:62px}

.cal-dh.we{background:#FAFBFE}
.cal-dh.today{background:linear-gradient(180deg,#FFF9E8,#fff)}
.cal-dh .dnum{font-size:19px;font-weight:800;line-height:1;color:#1E293B}
.cal-dh.today .dnum{color:#8A6D0B;background:var(--gold2);border-radius:99px;width:30px;height:30px;display:grid;place-items:center;box-shadow:0 4px 12px -4px rgba(212,175,55,.9)}
.cal-dh .dow{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#94A3B8}
.cal-gut{position:sticky;left:0;z-index:4;background:#fff;border-right:1px solid var(--line)}
.cal-gut span{position:absolute;right:8px;font-size:10.5px;font-weight:700;color:#94A3B8;transform:translateY(-50%)}
.cal-col{position:relative;border-right:1px solid #EEF2F7;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),#EEF2F7 calc(var(--hour) - 1px),#EEF2F7 var(--hour));cursor:crosshair;touch-action:pan-y}
.cal-col.we{background-color:#FBFCFE}
.cal-col.today{background-color:#FFFDF6}
.cal-col .half{position:absolute;left:0;right:0;border-top:1px dashed #F1F5F9;pointer-events:none}
.cal-work{position:absolute;left:0;right:0;background:rgba(37,99,235,.028);pointer-events:none}
.blk{position:absolute;left:2px;right:2px;border-radius:.5rem;overflow:hidden;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(225,29,72,.13) 0 9px,rgba(225,29,72,.05) 9px 18px);border:1px solid rgba(225,29,72,.3);animation:hatch 26s linear infinite}

.blk.demo b{color:#475569}
.ev{position:absolute;border-radius:.55rem;padding:4px 6px;font-size:11px;line-height:1.25;overflow:hidden;cursor:grab;border-left:3px solid var(--c);background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(15,23,42,.08);transition:box-shadow .15s;touch-action:none;user-select:none}

.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:12;pointer-events:none}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function money(v){return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0)}
function p2(n){return n<10?'0'+n:''+n}
function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function sow(d){var x=sod(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function key(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function fromKey(k){var a=String(k).split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function mins(d){return d.getHours()*60+d.getMinutes()}
function atMin(day,m){var x=sod(day);x.setMinutes(m);return x}
function hhmm(m){return p2(Math.floor(m/60)%24)+':'+p2(m%60)}
function tOf(d){return p2(d.getHours())+':'+p2(d.getMinutes())}
function dtLocal(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())}
function human(d){return d.getDate()+' '+MONG[d.getMonth()]}
function humanFull(d){return DOWF[(d.getDay()+6)%7]+', '+d.getDate()+' '+MONG[d.getMonth()]+' '+d.getFullYear()}
function sameDay(a,b){return key(a)===key(b)}
function snap(m){return Math.round(m/SNAP)*SNAP}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function durTxt(a,b){var m=Math.round((new Date(b)-new Date(a))/60000);return m>=60?(Math.floor(m/60)+' ч'+(m%60?' '+(m%60)+' мин':'')):m+' мин'}

/* ============ BUSY / FILTERS ============ */
function blackouts(day){
  var k=key(day),wd=(day.getDay()+6)%7,out=[];
  allAvail().forEach(function(a){
    var hit=a.kind==='weekly'?(a.weekdays||[]).indexOf(wd)>=0:(k>=a.startDate&&k<=(a.endDate||a.startDate));
    if(hit)out.push({s:clamp(toMin(a.startTime),0,1440),e:clamp(toMin(a.endTime),0,1440),label:a.label||'Денчик не абонент',demo:!!a.demo,id:a.id});
  });
  return out.filter(function(b){return b.e>b.s}).sort(function(a,b){return a.s-b.s});
}
function peopleOf(m){
  var a=(m.participantEmails||[]).slice();
  if(m.ownerEmail&&a.indexOf(m.ownerEmail)<0)a.push(m.ownerEmail);
  return a.map(function(e){return String(e).toLowerCase()});
}
function overlaps(aS,aE,bS,bE){return aS<bE&&bS<aE}
function conflictsFor(start,end,emails,skipId){
  var s=new Date(start).getTime(),e=new Date(end).getTime(),pp=(emails||[]).map(function(x){return String(x).toLowerCase()});
  return allMtgs().filter(function(m){
    if(m.id===skipId||m.status==='cancelled')return false;
    if(!overlaps(s,e,new Date(m.start).getTime(),new Date(m.end).getTime()))return false;
    return peopleOf(m).some(function(x){return pp.indexOf(x)>=0});
  });
}
function blackoutHit(start,end){
  var s=new Date(start),e=new Date(end),out=[],d=sod(s);
  while(d<=e){
    var sm=sameDay(d,s)?mins(s):0,em=sameDay(d,e)?mins(e):1440;
    blackouts(d).forEach(function(b){if(overlaps(sm,em,b.s,b.e))out.push({day:new Date(d),b:b})});
    d=addD(d,1);
  }
  return out;
}
function busyHours(email,day){
  var t=0,k=key(day);
  allMtgs().forEach(function(m){
    if(m.status==='cancelled'||key(new Date(m.start))!==k)return;
    if(peopleOf(m).indexOf(String(email).toLowerCase())<0)return;
    t+=(new Date(m.end)-new Date(m.start))/60000;
  });
  return t/60;
}
function filtersActive(){return S.cal.q.trim()||S.cal.person!=='all'||S.cal.type!=='all'}
function filteredMtgs(){
  var q=S.cal.q.trim().toLowerCase();
  return allMtgs().filter(function(m){
    if(S.cal.type!=='all'&&m.type!==S.cal.type)return false;
    if(S.cal.person==='mine'){if(peopleOf(m).indexOf(String(S.user.email).toLowerCase())<0)return false}
    else if(S.cal.person!=='all'&&peopleOf(m).indexOf(S.cal.person.toLowerCase())<0)return false;
    if(q){
      var d=m.dealId?dealById(m.dealId):null;
      var hay=[m.title,m.externalProject,m.location,m.notes,d?d.businessName:''].concat(m.participantEmails||[]).join(' ').toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
}
function filteredTasks(){
  var q=S.cal.q.trim().toLowerCase(),out=[];
  S.deals.forEach(function(d){
    if(S.cal.person==='mine'&&!(d.ownerUid===S.user.uid||d.responsibleUid===S.user.uid))return;
    if(S.cal.person!=='all'&&S.cal.person!=='mine'&&String(d.ownerEmail||'').toLowerCase()!==S.cal.person.toLowerCase())return;
    (d.tasks||[]).forEach(function(t,i){
      if(!t.date)return;
      if(q&&(t.text+' '+(d.businessName||'')).toLowerCase().indexOf(q)<0)return;
      out.push({deal:d,task:t,index:i});
    });
  });

}

function findSlots(){
  var emails=S.cal.person==='all'||S.cal.person==='mine'?[S.user.email]:[S.cal.person,S.user.email];
  var need=+S.finder.dur,res=[],d=sod(new Date()),now=Date.now();
  for(var i=0;i<+S.finder.days&&res.length<8;i++){
    var day=addD(d,i);if((day.getDay()+6)%7>4)continue;
    var bs=blackouts(day);
    for(var m=WORK_S;m+need<=WORK_E;m+=30){
      var s=atMin(day,m),e=atMin(day,m+need);
      if(s.getTime()<now+30*60000)continue;
      if(bs.some(function(b){return overlaps(m,m+need,b.s,b.e)}))continue;
      if(conflictsFor(s.toISOString(),e.toISOString(),emails,null).length)continue;
      res.push({s:s,e:e});if(res.length>=8)break;
    }
  }
  return res;
}
S.finder={dur:60,days:14};
function layout(items){
  var arr=items.slice().sort(function(a,b){return a.s-b.s||b.e-a.e}),clusters=[],cur=[],end=-1;
  arr.forEach(function(it){if(cur.length&&it.s>=end){clusters.push(cur);cur=[];end=-1}cur.push(it);end=Math.max(end,it.e)});
  if(cur.length)clusters.push(cur);
  clusters.forEach(function(cl){
    var cols=[];
    cl.forEach(function(it){
      var placed=false;
      for(var i=0;i<cols.length;i++){if(cols[i][cols[i].length-1].e<=it.s){cols[i].push(it);it.col=i;placed=true;break}}
      if(!placed){cols.push([it]);it.col=cols.length-1}
    });
    cl.forEach(function(it){it.cols=cols.length});
  });
  return arr;
}

function pipelineHTML(all){

    var list=deals.filter(function(d){return d.stage===st.id});
    var sum=list.reduce(function(a,d){return a+(d.investmentAmount||0)},0);
    var cards=list.map(function(d){
      var edit=canEditDeal(d),del=canDeleteDeal(d);
      var open=(d.tasks||[]).filter(function(t){return !t.done}),od=open.some(isOverdue);
      var mark=open.length?'<span title="'+(od?'Просроченная задача':'Есть задачи')+'" style="width:9px;height:9px;border-radius:99px;background:'+(od?'#E11D48':'#10B981')+'" class="'+(od?'blink':'')+'"></span>':'';

      var mtg=nm?'<div style="display:flex;gap:5px;align-items:center;font-size:9.5px;font-weight:700;color:#1D4ED8;margin-top:5px"><i class="fa-solid fa-calendar-day"></i>'+human(new Date(nm.start))+' · '+tOf(new Date(nm.start))+'</div>':'';
      var drag=edit?'draggable="true" data-drag-deal="'+d.id+'"':'';
      var delBtn=del?'<button data-act="deal-del" data-id="'+d.id+'" class="delbtn" style="position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:99px;background:#fff;border:1px solid #E2E8F0;color:#94A3B8;cursor:pointer;opacity:0;transition:.15s"><i class="fa-solid fa-trash" style="font-size:10px"></i></button>':'';
      var lock=edit?'':'<span style="position:absolute;top:8px;right:8px;color:#94A3B8"><i class="fa-solid fa-lock" style="font-size:10px"></i></span>';
      return '<div '+drag+' data-act="deal-open" data-id="'+d.id+'" class="pcard fade" style="position:relative;background:'+st.bg+';border-left:3px solid '+st.c+';border-radius:0 12px 12px 0;padding:11px 12px;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.06)">'+delBtn+lock+
        '<div style="font-weight:700;font-size:13px;padding-right:26px;line-height:1.3">'+esc(d.businessName||d.title)+'</div>'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px"><span style="font-size:12px;font-weight:800;color:'+st.c+'">'+money(d.investmentAmount)+'</span>'+mark+'</div>'+mtg+
        '<div style="margin-top:8px;padding-top:7px;border-top:1px solid rgba(15,23,42,.07);display:flex;gap:6px;align-items:center"><span class="avat" style="background:'+colorOf(d.ownerEmail)+'">'+esc(initials(d.ownerEmail))+'</span><span style="font-size:9.5px;color:#64748B;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(nameOf(d.ownerEmail))+'</span></div></div>';
    }).join('');
    var plus='<button data-act="deal-new-stage" data-v="'+st.id+'" title="Сделка на этом этапе" style="width:23px;height:23px;border-radius:7px;background:rgba(255,255,255,.8);border:1px solid rgba(15,23,42,.08);color:#475569;cursor:pointer"><i class="fa-solid fa-plus" style="font-size:9px"></i></button>';
    return '<div style="width:272px;flex-shrink:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden">'+
      '<div style="padding:11px 13px;background:'+st.hd+';border-bottom:1px solid rgba(15,23,42,.06)">'+
        '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div style="font-size:12px;font-weight:800;line-height:1.25;flex:1">'+esc(st.name)+'</div><div style="display:flex;gap:5px;align-items:center"><span class="chip" style="background:rgba(255,255,255,.75);color:#475569">'+list.length+'</span>'+plus+'</div></div>'+
        '<div style="font-size:10px;font-weight:700;color:#64748B;margin-top:3px">'+money(sum)+'</div></div>'+
      '<div class="pcol" data-stage="'+st.id+'" style="flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:120px">'+cards+(list.length?'':'<div style="text-align:center;padding:26px 0;color:#CBD5E1;font-size:11px;font-weight:600">Пусто</div>')+'</div></div>';
  }).join('');

function readMtg(){
  var M=S.modal;if(!M||M.kind!=='mtg')return;
  function v(id){var n=document.getElementById(id);return n?n.value:''}
  var d=M.draft;
  d.title=v('f_title');d.type=v('f_type')||d.type;d.status=v('f_status')||d.status;d.location=v('f_loc');d.notes=v('f_notes');
  var ow=v('f_owner');if(ow)d.ownerEmail=ow;
  var dv=v('f_deal');
  if(dv==='__ext'){d.dealId=null;d.externalProject=v('f_ext')}else{d.dealId=dv||null;if(dv)d.externalProject=''}
  var parts=[];document.querySelectorAll('[data-part]').forEach(function(n){if(n.checked)parts.push(n.getAttribute('data-part'))});
  if(parts.length)d.participantEmails=parts;
  var day=v('f_date'),st=v('f_start'),en=v('f_end');
  if(day&&st&&en){var base=fromKey(day),s=atMin(base,toMin(st)),e=atMin(base,toMin(en));if(e<=s)e=new Date(s.getTime()+30*60000);d.start=s.toISOString();d.end=e.toISOString()}
}
function saveMeeting(){
  readMtg();
  var M=S.modal,d=M.draft,err=document.getElementById('mtgErr');
  function bad(m){err.textContent=m;err.style.display='block';err.scrollIntoView({block:'nearest',behavior:'smooth'})}
  if(!d.title.trim())return bad('Укажите тему встречи');
  if(!(d.participantEmails||[]).length)return bad('Выберите хотя бы одного участника');
  if(new Date(d.end)<=new Date(d.start))return bad('Окончание должно быть позже начала');
  var bh=blackoutHit(d.start,d.end),ov=document.getElementById('f_override');
  if(bh.length&&!(isAdmin()&&ov&&ov.checked))return bad('Время закрыто: «'+bh[0].b.label+'». Выберите другой слот.');
  var ownerEmail=d.ownerEmail||S.user.email;
  var ownerUid=isAdmin()?(dirUid(ownerEmail)||S.user.uid):S.user.uid;
  if(isAdmin()&&ownerEmail!==S.user.email&&!dirUid(ownerEmail))return bad('Этот партнёр ещё не входил в систему — владелец не может быть назначен. Попросите его войти один раз.');
  var parts=d.participantEmails.slice();
  if(parts.map(function(x){return x.toLowerCase()}).indexOf(ownerEmail.toLowerCase())<0)parts.push(ownerEmail);
  var payload={title:d.title.trim(),type:d.type,status:d.status,start:d.start,end:d.end,participantEmails:parts,ownerUid:ownerUid,ownerEmail:ownerEmail,dealId:d.dealId||null,externalProject:(d.externalProject||'').trim(),location:(d.location||'').trim(),notes:d.notes||'',updatedAt:new Date().toISOString()};
  var wasDemo=M.id&&String(M.id).indexOf('demo_')===0;
  var id=M.id&&!wasDemo?M.id:null;
  S.demo=false;try{localStorage.setItem('new_demo_off','1')}catch(e){}
  closeModal();
  if(id){
    var i=S.meetings.findIndex(function(x){return x.id===id});
    if(i>=0)S.meetings[i]=Object.assign({},S.meetings[i],payload);
    paint();
    writeMtg(id,payload).then(function(){toast('Встреча обновлена — видна всем участникам')}).catch(function(e){toast('Не сохранено: '+e.message,{tone:'bad',icon:'fa-triangle-exclamation'})});
  }else{
    var tmp=Object.assign({id:'tmp_'+uid()},payload,{createdAt:new Date().toISOString()});
    S.meetings.push(tmp);paint();
    createMtg(payload).then(function(){toast('Встреча назначена · '+human(new Date(payload.start))+' '+tOf(new Date(payload.start)))})
      .catch(function(e){S.meetings=S.meetings.filter(function(x){return x.id!==tmp.id});paint();toast('Не создано: '+e.message,{tone:'bad',icon:'fa-triangle-exclamation'})});
  }
}
function deleteMeeting(){

function icsFor(m){
  function z(d){return new Date(d).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'}
  var d=m.dealId?dealById(m.dealId):null;
  var desc=(m.notes||'')+(d?'\\nСделка: '+(d.businessName||d.title):m.externalProject?'\\nПроект: '+m.externalProject:'')+'\\nУчастники: '+(m.participantEmails||[]).map(nameOf).join(', ');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NEW Invest CRM//RU','BEGIN:VEVENT','UID:'+(m.id||uid())+'@new-invest','DTSTAMP:'+z(new Date()),'DTSTART:'+z(m.start),'DTEND:'+z(m.end),'SUMMARY:'+String(m.title).replace(/[,;]/g,'\\$&'),'LOCATION:'+String(m.location||'').replace(/[,;]/g,'\\$&'),'DESCRIPTION:'+desc,'END:VEVENT','END:VCALENDAR'].join('\r\n');
}

function readDeal(){
  var M=S.modal;if(!M||M.kind!=='deal')return;
  function v(id){var n=document.getElementById(id);return n?n.value:''}
  var d=M.draft;
  d.businessName=v('d_name');d.investmentAmount=v('d_sum');d.stage=v('d_stage')||d.stage;d.businessDescription=v('d_desc');
  var ow=v('d_owner');if(ow)d.ownerEmail=ow;
  document.querySelectorAll('[data-ct]').forEach(function(n){
    var i=+n.getAttribute('data-i'),k=n.getAttribute('data-ct');
    if(!d.contacts[i])d.contacts[i]={};
    d.contacts[i][k]=n.value;
  });
}
function saveDeal(){
  readDeal();
  var M=S.modal,d=M.draft,err=document.getElementById('dealErr'),sum=parseFloat(d.investmentAmount);
  if(!String(d.businessName).trim()||isNaN(sum)||sum<=0){err.textContent='Заполните название компании и сумму инвестиций';err.style.display='block';return}
  var payload={businessName:String(d.businessName).trim(),title:String(d.businessName).trim(),businessDescription:d.businessDescription,investmentAmount:sum,stage:d.stage,contacts:(d.contacts||[]).filter(function(c){return c.name||c.phone||c.email})};
  if(isAdmin()&&M.id){
    var ou=dirUid(d.ownerEmail);
    if(!ou){err.textContent='Новый владелец ещё не входил в систему';err.style.display='block';return}
    payload.ownerUid=ou;payload.ownerEmail=d.ownerEmail;
  }
  closeModal();
  if(M.id){
    var i=S.deals.findIndex(function(x){return x.id===M.id});
    if(i>=0)S.deals[i]=Object.assign({},S.deals[i],payload);
    paint();updateDeal(M.id,payload).then(function(){toast('Сделка сохранена')}).catch(function(e){toast('Не сохранено: '+e.message,{tone:'bad'})});
  }else{
    payload.ownerUid=S.user.uid;payload.ownerEmail=S.user.email;payload.responsibleUid=S.user.uid;
    payload.comments=[];payload.tasks=[];payload.createdAt=new Date().toISOString();
    var tmp=Object.assign({id:'tmp_'+uid()},payload);S.deals.unshift(tmp);paint();
    db.collection('deals').add(payload).then(function(){toast('Сделка создана')}).catch(function(e){S.deals=S.deals.filter(function(x){return x.id!==tmp.id});paint();toast('Ошибка: '+e.message,{tone:'bad'})});
  }
}

  if(!confirm('Удалить сделку «'+(d.businessName||d.title)+'»?'))return;

  if(S.modal)closeModal();

  toast('Сделка удалена',{tone:'warn',icon:'fa-trash',ms:7000,action:'Отменить',onAction:function(){

function uploadFile(input){
  var f=input.files&&input.files[0];if(!f||!S.modal.id)return;
  if(f.size>20*1024*1024){toast('Файл больше 20 МБ — используйте ссылку',{tone:'warn'});return}
  var id=S.modal.id;S.uploading=f.name;paintDeal();
  var r=new FileReader();
  r.onload=function(){
    var b64=String(r.result).split(',')[1],CH=700000,ch=[];
    for(var i=0;i<b64.length;i+=CH)ch.push(b64.substr(i,CH));
    db.collection('deals').doc(id).collection('files').add({dealId:id,name:f.name,size:f.size,type:f.type||'',chunkCount:ch.length,external:false,createdAt:new Date().toISOString()})
      .then(function(ref){return Promise.all(ch.map(function(c,ix){return db.collection('deals').doc(id).collection('chunks').add({fileId:ref.id,index:ix,data:c})}))})
      .then(function(){S.uploading=null;loadFiles(id);toast('Файл загружен')})
      .catch(function(e){S.uploading=null;paintDeal();toast('Ошибка: '+e.message,{tone:'bad'})});
  };
  r.readAsDataURL(f);
}
function openFile(fid){
  var f=S.files.find(function(x){return x.id===fid});if(!f)return;
  if(f.url){window.open(f.url,'_blank');return}
  var id=S.modal.id;
  db.collection('deals').doc(id).collection('chunks').where('fileId','==',fid).get().then(function(s){
    var ch=s.docs.map(function(d){return d.data()}).sort(function(a,b){return a.index-b.index});
    var b64='';ch.forEach(function(c){b64+=c.data||''});
    var bin=atob(b64),arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([arr],{type:f.type||'application/octet-stream'}));
    var a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1500);
  }).catch(function(){toast('Не удалось открыть файл',{tone:'bad'})});
}
function fileDelete(fid){
  if(!confirm('Удалить файл?'))return;
  var id=S.modal.id;
  db.collection('deals').doc(id).collection('chunks').where('fileId','==',fid).get().then(function(s){
    var b=db.batch();s.docs.forEach(function(d){b.delete(d.ref)});
    b.delete(db.collection('deals').doc(id).collection('files').doc(fid));return b.commit();
  }).then(function(){loadFiles(id);toast('Файл удалён')}).catch(function(e){toast('Ошибка: '+e.message,{tone:'bad'})});
}
function linkAdd(){
  var url=prompt('Ссылка на файл (Яндекс.Диск и т.п.):');if(!url)return;
  var name=prompt('Название:','Внешний файл')||'Внешний файл';
  var id=S.modal.id;
  db.collection('deals').doc(id).collection('files').add({dealId:id,name:name,size:0,external:true,url:url.trim(),createdAt:new Date().toISOString()})
    .then(function(){loadFiles(id);toast('Ссылка прикреплена')}).catch(function(e){toast('Ошибка: '+e.message,{tone:'bad'})});
}

  var funded=d.filter(function(x){return x.stage==='funded'}),fusum=funded.reduce(function(a,x){return a+(x.investmentAmount||0)},0);
  var aud=d.filter(function(x){return x.stage==='audit'||x.stage==='funded'}).length;
  var cA=total?((aud/total)*100).toFixed(1):'0.0',cF=total?((funded.length/total)*100).toFixed(1):'0.0';
  var wk=sow(new Date()),we=addD(wk,7);
  var wkM=allMtgs().filter(function(m){var t=new Date(m.start);return t>=wk&&t<we});
  var done=wkM.filter(function(m){return m.status==='done'}).length;
  function kpi(ic,c,l,v,s){return '<div class="card" style="padding:16px"><div style="width:36px;height:36px;border-radius:12px;background:'+c+'1A;display:grid;place-items:center;margin-bottom:10px"><i class="fa-solid '+ic+'" style="color:'+c+'"></i></div><div style="font-size:9.5px;font-weight:800;letter-spacing:.08em;color:#94A3B8">'+l+'</div><div style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px">'+v+'</div><div style="font-size:10px;color:#94A3B8;font-weight:600;margin-top:3px">'+s+'</div></div>'}
  return '<div class="pipe-scroll" style="padding:16px"><div style="display:flex;flex-direction:column;gap:14px;max-width:1400px;margin:0 auto">'+
    '<div class="stagger" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">'+
      kpi('fa-briefcase','#2563EB','ВСЕГО СДЕЛОК',total,'Факапов: '+failed.length)+
      kpi('fa-coins','#D97706','ОБЪЁМ БЕЗ ФАКАПОВ',money(raw-fsum),'Исключено: '+money(fsum))+
      kpi('fa-circle-check','#10B981','ПОЛУЧЕНО',money(fusum),'Успешных: '+funded.length)+
      kpi('fa-magnifying-glass-chart','#7C3AED','КОНВЕРСИЯ В АУДИТ',cA+'%','Дошли: '+aud+' из '+total)+
      kpi('fa-percent','#059669','КОНВЕРСИЯ В ИНВЕСТИЦИИ',cF+'%','Получено: '+funded.length+' из '+total)+
      kpi('fa-calendar-check','#0891B2','ВСТРЕЧ НА НЕДЕЛЕ',wkM.length,'Проведено: '+done)+
    '</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px">'+
    '<div class="card" style="padding:16px"><div style="font-size:13px;font-weight:800;margin-bottom:10px">Распределение по этапам</div><div style="height:260px"><canvas id="c1"></canvas></div></div>'+
    '<div class="card" style="padding:16px"><div style="font-size:13px;font-weight:800;margin-bottom:10px">Объём инвестиций, млн €</div><div style="height:260px"><canvas id="c2"></canvas></div></div>'+
    '<div class="card" style="padding:16px"><div style="font-size:13px;font-weight:800;margin-bottom:10px">Встречи по дням недели</div><div style="height:260px"><canvas id="c3"></canvas></div></div>'+
    '<div class="card" style="padding:16px"><div style="font-size:13px;font-weight:800;margin-bottom:10px">'+(isAdmin()?'Эффективность партнёров':'Моя эффективность')+'</div><div style="height:260px"><canvas id="c4"></canvas></div></div>'+
    '</div></div></div>';
}
function charts(){
  if(!window.Chart)return;
  var d=anDeals();
  Chart.defaults.font.family="'Inter',sans-serif";Chart.defaults.color='#94A3B8';
  var labels=STAGES.map(function(s){return s.name.length>16?s.name.slice(0,16)+'…':s.name});
  var counts=STAGES.map(function(s){return d.filter(function(x){return x.stage===s.id}).length});
  var sums=STAGES.map(function(s){return d.filter(function(x){return x.stage===s.id}).reduce(function(a,x){return a+(x.investmentAmount||0)},0)/1e6});
  var pal=STAGES.map(function(s){return s.c});
  function mk(id,cfg){var n=document.getElementById(id);if(n)new Chart(n,cfg)}
  mk('c1',{type:'bar',data:{labels:labels,datasets:[{data:counts,backgroundColor:pal,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1},grid:{color:'#F1F5F9'}},x:{grid:{display:false},ticks:{font:{size:8.5}}}}}});
  mk('c2',{type:'line',data:{labels:labels,datasets:[{data:sums,borderColor:'#D4AF37',backgroundColor:'rgba(212,175,55,.12)',fill:true,tension:.35,pointBackgroundColor:'#D4AF37'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#F1F5F9'}},x:{grid:{display:false},ticks:{font:{size:8.5},maxRotation:50}}}}});
  var wd=[0,0,0,0,0,0,0],wdd=[0,0,0,0,0,0,0];
  allMtgs().forEach(function(m){var i=(new Date(m.start).getDay()+6)%7;wd[i]++;if(m.status==='done')wdd[i]++});
  mk('c3',{type:'bar',data:{labels:DOW,datasets:[{label:'Назначено',data:wd,backgroundColor:'#2563EB',borderRadius:5},{label:'Проведено',data:wdd,backgroundColor:'#10B981',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}},scales:{y:{beginAtZero:true,ticks:{stepSize:1},grid:{color:'#F1F5F9'}},x:{grid:{display:false}}}}});
  if(isAdmin()){
    var ml=USERS.map(function(u){return u.short});
    var mf=USERS.map(function(u){return d.filter(function(x){return String(x.ownerEmail||'').toLowerCase()===u.email.toLowerCase()&&x.stage==='funded'}).reduce(function(a,x){return a+(x.investmentAmount||0)},0)/1e6});
    var mm=USERS.map(function(u){return allMtgs().filter(function(m){return peopleOf(m).indexOf(u.email.toLowerCase())>=0}).length});
    mk('c4',{type:'bar',data:{labels:ml,datasets:[{label:'Получено, млн €',data:mf,backgroundColor:'#10B981',borderRadius:5,yAxisID:'y'},{label:'Встреч',data:mm,backgroundColor:'#7C3AED',borderRadius:5,yAxisID:'y1'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}},scales:{y:{position:'left',beginAtZero:true,grid:{color:'#F1F5F9'}},y1:{position:'right',beginAtZero:true,grid:{drawOnChartArea:false}},x:{grid:{display:false}}}}});
  }else{
    var f1=d.filter(function(x){return x.stage==='funded'}).reduce(function(a,x){return a+(x.investmentAmount||0)},0)/1e6;
    var f2=d.filter(function(x){return x.stage!=='funded'&&x.stage!=='failed'}).length;
    var f3=d.filter(function(x){return x.stage==='failed'}).length;
    mk('c4',{type:'doughnut',data:{labels:['Получено, млн €','В работе','Провалено'],datasets:[{data:[f1,f2,f3],backgroundColor:['#10B981','#D97706','#E11D48'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}}}});
  }
}

/* ============ EVENTS ============ */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v'),id=el.getAttribute('data-id');
  function stop(){ev.preventDefault();ev.stopPropagation()}
  switch(a){
    case 'nav':stop();S.view=v;document.getElementById('mnav').style.display='none';render();break;
    case 'mnav':stop();var mn=document.getElementById('mnav');mn.style.display=mn.style.display==='none'?'block':'none';break;
    case 'mnav-close':stop();document.getElementById('mnav').style.display='none';break;
    case 'logout':stop();logout();break;
    case 'close':stop();closeModal();break;
    case 'access':stop();document.getElementById('mnav').style.display='none';openAccess();break;
    case 'rules-copy':stop();fallbackCopy(RULES_TEXT);toast('Правила скопированы — вставьте в Firebase Console и нажмите Publish');break;
    case 'demo-off':stop();S.demo=false;try{localStorage.setItem('new_demo_off','1')}catch(e){}render();break;
    case 'demo-keep':stop();persistDemo();break;
    case 'cal-prev':stop();shift(-1);break;
    case 'cal-next':stop();shift(1);break;
    case 'cal-today':stop();S.cal.anchor=new Date();paintCal();break;
    case 'cal-mode':stop();S.cal.mode=v;paintCal();break;
    case 'cal-day':stop();S.cal.anchor=fromKey(v);if(S.cal.mode==='month')S.cal.mode='day';paintCal();break;
    case 'mini-prev':stop();S.cal.anchor=new Date(S.cal.anchor.getFullYear(),S.cal.anchor.getMonth()-1,1);paintCal();break;
    case 'mini-next':stop();S.cal.anchor=new Date(S.cal.anchor.getFullYear(),S.cal.anchor.getMonth()+1,1);paintCal();break;
    case 'cal-type':stop();S.cal.type=v;paintCal();break;
    case 'layer':stop();S.cal.layers[v]=!S.cal.layers[v];paintCal();break;
    case 'filters-reset':stop();resetFilters();break;
    case 'past-toggle':stop();S.cal.past=!S.cal.past;paintCal();break;
    case 'past-on':stop();S.cal.past=true;paintCal();break;
    case 'slot-pick':stop();openMeeting(null,{start:v});break;
    case 'view-save':stop();saveView();break;
    case 'view-load':stop();loadView(+v);break;
    case 'view-del':stop();S.saved.splice(+v,1);try{localStorage.setItem('new_saved_views',JSON.stringify(S.saved))}catch(e){}paintCal();break;
    case 'mtg-new':stop();openMeeting(null,null);break;
    case 'mtg-open':stop();openMeeting(id,null);break;
    case 'mtg-for-deal':stop();var did=S.modal.id;closeModal();openMeeting(null,{dealId:did});break;
    case 'mtg-save':stop();saveMeeting();break;
    case 'mtg-del':stop();deleteMeeting();break;
    case 'mtg-ics':stop();downloadIcs();break;
    case 'mtg-copy':stop();copyInvite();break;
    case 'mtg-dur':stop();readMtg();S.modal.draft.end=new Date(new Date(S.modal.draft.start).getTime()+(+v)*60000).toISOString();paintMeeting();break;
    case 'av-new':stop();openAvail(null);break;
    case 'av-edit':stop();openAvail(id);break;
    case 'av-save':stop();saveAvail();break;
    case 'av-del':stop();deleteAvail(id||(S.modal&&S.modal.id));break;
    case 'av-preset':stop();readAvail();var dd=S.modal.draft;if(v==='day'){dd.startTime='00:00';dd.endTime='23:00'}if(v==='morning'){dd.startTime='09:00';dd.endTime='12:00'}if(v==='evening'){dd.startTime='18:00';dd.endTime='23:00'}paintAvailModal();break;
    case 'task-open':stop();openTask(id,+el.getAttribute('data-i'));break;
    case 'task-done':stop();taskDone();break;
    case 'task-resched':stop();S.modal.resched=true;paintTask();break;
    case 'task-cancel':stop();S.modal.resched=false;paintTask();break;
    case 'task-save-dt':stop();taskSaveDt();break;
    case 'deal-new':stop();openDeal(null,null);break;
    case 'deal-new-stage':stop();openDeal(null,v);break;
    case 'deal-open':stop();openDeal(id,null);break;
    case 'deal-save':stop();saveDeal();break;
    case 'deal-del':stop();dealDelete(id||(S.modal&&S.modal.id));break;
    case 'ct-add':stop();readDeal();S.modal.draft.contacts.push({name:'',phone:'',email:'',telegram:'',max:''});paintDeal();break;
    case 'ct-del':stop();readDeal();S.modal.draft.contacts.splice(+v,1);paintDeal();break;
    case 'dt-add':stop();dealTaskAdd();break;
    case 'dt-toggle':stop();dealTaskToggle(+v);break;
    case 'dt-del':stop();dealTaskDel(+v);break;
    case 'cm-add':stop();dealComment();break;
    case 'file-open':stop();openFile(id);break;
    case 'file-del':stop();fileDelete(id);break;
    case 'link-add':stop();linkAdd();break;
    case 'an-scope':stop();S.anScope=v;renderView();break;
  }
});
function shift(n){
  if(S.cal.mode==='month')S.cal.anchor=new Date(S.cal.anchor.getFullYear(),S.cal.anchor.getMonth()+n,1);
  else if(S.cal.mode==='agenda'){S.cal.past=!S.cal.past&&n<0?true:S.cal.past;S.cal.anchor=addD(S.cal.anchor,7*n)}
  else S.cal.anchor=addD(S.cal.anchor,S.cal.mode==='week'?7*n:n);
  paintCal();
}
function saveView(){
  var name=prompt('Название вида:','Мой фильтр');if(!name)return;
  S.saved.push({name:name,mode:S.cal.mode,type:S.cal.type,person:S.cal.person,layers:JSON.parse(JSON.stringify(S.cal.layers)),q:S.cal.q});
  try{localStorage.setItem('new_saved_views',JSON.stringify(S.saved))}catch(e){}
  paintCal();toast('Вид сохранён');
}
function loadView(i){
  var v=S.saved[i];if(!v)return;
  S.cal.mode=v.mode;S.cal.type=v.type;S.cal.person=v.person;S.cal.layers=v.layers;S.cal.q=v.q;
  var q=document.getElementById('calQ');if(q)q.value=v.q;
  var p=document.getElementById('calPerson');if(p)p.value=v.person;
  paintCal();toast('Вид «'+v.name+'» применён');
}

/* ============ DRAG ============ */
var drag=null;
document.addEventListener('pointerdown',function(ev){
  if(S.view!=='calendar'||S.cal.mode==='month'||S.cal.mode==='agenda')return;
  if(ev.button!==0)return;
  var rz=ev.target.closest('[data-mtg-resize]'),mv=ev.target.closest('[data-mtg-drag]'),col=ev.target.closest('.cal-col');
  if(!col)return;
  var px=S.cal.hourPx/60;
  if(rz||mv){
    if(ev.pointerType!=='mouse')return;
    var id=rz?rz.getAttribute('data-mtg-resize'):mv.getAttribute('data-mtg-drag');
    var m=allMtgs().find(function(x){return x.id===id});
    if(!m||!canEditMtg(m))return;
    ev.preventDefault();
    var node=rz?rz.parentElement:mv;
    drag={type:rz?'resize':'move',id:id,m:m,node:node,x0:ev.clientX,y0:ev.clientY,px:px,moved:false,s0:new Date(m.start),e0:new Date(m.end)};
    node.classList.add('ghost');
    try{node.setPointerCapture(ev.pointerId)}catch(e){}
    return;
  }
  if(ev.target.closest('.ev')||ev.target.closest('.blk'))return;
  if(ev.pointerType!=='mouse')return;
  var r=col.getBoundingClientRect();
  var m0=clamp(snap(DSTART*60+(ev.clientY-r.top)/px),DSTART*60,DEND*60);
  var sel=document.createElement('div');sel.className='sel';col.appendChild(sel);
  drag={type:'create',day:fromKey(col.getAttribute('data-day')),m0:m0,m1:m0+60,col:col,node:sel,px:px,y0:ev.clientY,moved:false};
  paintSel();ev.preventDefault();
});
document.addEventListener('pointermove',function(ev){
  if(!drag)return;
  if(drag.type==='create'){
    var r=drag.col.getBoundingClientRect();
    drag.m1=clamp(snap(DSTART*60+(ev.clientY-r.top)/drag.px),DSTART*60,DEND*60);
    drag.moved=Math.abs(ev.clientY-drag.y0)>4;paintSel();return;
  }
  if(Math.abs(ev.clientX-drag.x0)>3||Math.abs(ev.clientY-drag.y0)>3)drag.moved=true;
  if(!drag.moved)return;
  var dm=snap((ev.clientY-drag.y0)/drag.px);
  if(drag.type==='resize'){
    var len=Math.max(SNAP,snap((drag.e0-drag.s0)/60000)+dm);
    drag.node.style.height=Math.max(18,len*drag.px-2)+'px';drag.newLen=len;
  }else{
    var days=daysOfView(),target=null;
    for(var i=0;i<days.length;i++){
      var n=document.querySelector('.cal-col[data-day="'+key(days[i])+'"]');if(!n)continue;
      var rr=n.getBoundingClientRect();
      if(ev.clientX>=rr.left&&ev.clientX<=rr.right){target={day:days[i],node:n};break}
    }
    var shiftD=target?Math.round((target.day-sod(drag.s0))/86400000):0;
    drag.node.style.top=((mins(drag.s0)+dm-DSTART*60)*drag.px)+'px';
    if(target&&target.node!==drag.node.parentNode)target.node.appendChild(drag.node);
    drag.newStart=atMin(addD(sod(drag.s0),shiftD),clamp(mins(drag.s0)+dm,DSTART*60,DEND*60));
  }
});
document.addEventListener('pointerup',function(){
  if(!drag)return;
  var D=drag;drag=null;
  if(D.type==='create'){
    D.node.remove();
    var a=Math.min(D.m0,D.m1),b=Math.max(D.m0,D.m1);
    if(b-a<SNAP){a=Math.min(a,DEND*60-60);b=a+60}
    openMeeting(null,{start:atMin(D.day,a).toISOString(),end:atMin(D.day,b).toISOString()});return;
  }
  D.node.classList.remove('ghost');
  if(!D.moved){paintCal();return}
  var m=D.m,len=(D.e0-D.s0)/60000,ns,ne;
  if(D.type==='resize'){ns=D.s0;ne=new Date(D.s0.getTime()+(D.newLen||len)*60000)}
  else{ns=D.newStart||D.s0;ne=new Date(ns.getTime()+len*60000)}
  if(mins(ne)>DEND*60)ne=atMin(sod(ns),DEND*60);
  var bh=blackoutHit(ns.toISOString(),ne.toISOString());
  if(bh.length&&!isAdmin()){toast('Нельзя: '+bh[0].b.label,{tone:'bad',icon:'fa-ban'});paintCal();return}
  var payload={start:ns.toISOString(),end:ne.toISOString(),updatedAt:new Date().toISOString()};
  var i=S.meetings.findIndex(function(x){return x.id===D.id});
  if(i>=0){S.meetings[i].start=payload.start;S.meetings[i].end=payload.end}
  paintCal();
  writeMtg(D.id,payload).then(function(){
    var cf=conflictsFor(payload.start,payload.end,peopleOf(m),D.id);
    toast((D.type==='resize'?'Длительность: ':'Перенесено: ')+human(ns)+' '+tOf(ns)+'–'+tOf(ne)+(cf.length?' · пересечение':''),{tone:cf.length?'warn':undefined,icon:cf.length?'fa-triangle-exclamation':'fa-calendar-check'});
  }).catch(function(e){toast('Не сохранено: '+e.message,{tone:'bad'});paintCal()});
});
function paintSel(){
  if(!drag||drag.type!=='create')return;
  var a=Math.min(drag.m0,drag.m1),b=Math.max(drag.m0,drag.m1);
  if(b-a<SNAP)b=a+60;
  drag.node.style.top=((a-DSTART*60)*drag.px)+'px';
  drag.node.style.height=((b-a)*drag.px)+'px';
  drag.node.textContent=hhmm(a)+'–'+hhmm(b);
}
var dealDrag=null;
document.addEventListener('dragstart',function(ev){
  var n=ev.target.closest('[data-drag-deal]');if(!n)return;
  dealDrag=n.getAttribute('data-drag-deal');
  try{ev.dataTransfer.setData('text/plain',dealDrag);ev.dataTransfer.effectAllowed='move'}catch(e){}
  setTimeout(function(){n.classList.add('dragging')},0);
});
document.addEventListener('dragend',function(){
  dealDrag=null;
  document.querySelectorAll('.dragging').forEach(function(n){n.classList.remove('dragging')});
  document.querySelectorAll('.drag-over').forEach(function(n){n.classList.remove('drag-over')});
});
document.addEventListener('dragover',function(ev){var c=ev.target.closest('.pcol');if(!c||!dealDrag)return;ev.preventDefault();c.classList.add('drag-over')});
document.addEventListener('dragleave',function(ev){var c=ev.target.closest('.pcol');if(c)c.classList.remove('drag-over')});
document.addEventListener('drop',function(ev){
  var c=ev.target.closest('.pcol');if(!c||!dealDrag)return;
  ev.preventDefault();c.classList.remove('drag-over');
  var d=dealById(dealDrag),st=c.getAttribute('data-stage');
  if(!d||!canEditDeal(d)||d.stage===st){if(d&&!canEditDeal(d))lockMsg();return}
  d.stage=st;renderView();
  updateDeal(d.id,{stage:st}).then(function(){toast('Этап: '+stage(st).name)}).catch(function(e){toast('Не сохранено: '+e.message,{tone:'bad'})});
});
document.addEventListener('click',function(ev){
  if(S.view!=='calendar'||S.cal.mode==='month'||S.cal.mode==='agenda')return;
  if(window.innerWidth>=768)return;
  var col=ev.target.closest('.cal-col');
  if(!col||ev.target.closest('.ev')||ev.target.closest('[data-act]'))return;
  var r=col.getBoundingClientRect(),px=S.cal.hourPx/60;
  var m=clamp(snap(DSTART*60+(ev.clientY-r.top)/px),DSTART*60,DEND*60-60);
  var day=fromKey(col.getAttribute('data-day'));
  openMeeting(null,{start:atMin(day,m).toISOString(),end:atMin(day,m+60).toISOString()});
});

/* ============ KEYBOARD / CLOCK ============ */
document.addEventListener('keydown',function(ev){
  if(!S.user)return;
  var t=ev.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'){if(ev.key==='Escape')ev.target.blur();return}
  if(ev.key==='Escape'){if(S.modal)closeModal();return}
  if(S.modal)return;
  var k=ev.key.toLowerCase();
  if(k==='n'){ev.preventDefault();openMeeting(null,null)}
  else if(k==='t'){S.cal.anchor=new Date();if(S.view==='calendar')paintCal()}
  else if(k==='d'){S.view='calendar';S.cal.mode='day';render()}
  else if(k==='w'){S.view='calendar';S.cal.mode='week';render()}
  else if(k==='m'){S.view='calendar';S.cal.mode='month';render()}
  else if(k==='l'){S.view='calendar';S.cal.mode='agenda';render()}
  else if(ev.key==='ArrowLeft'&&S.view==='calendar')shift(-1);
  else if(ev.key==='ArrowRight'&&S.view==='calendar')shift(1);
});
setInterval(function(){
  if(!S.user||S.view!=='calendar'||S.cal.mode==='month'||S.cal.mode==='agenda')return;
  var n=document.querySelector('.now');if(!n)return;
  var m=mins(new Date());
  if(m<DSTART*60||m>DEND*60){n.remove();return}
  n.style.top=((m-DSTART*60)*(S.cal.hourPx/60))+'px';
},30000);

/* ============ INIT ============ */
function init(){
  if(!FB||!auth){S.authLoading=false;render();fail(window.__fbErr||'Firebase не инициализирован');return}
  auth.onAuthStateChanged(onAuth);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
