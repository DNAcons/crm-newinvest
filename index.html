<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N.E.W. Invest CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        input, textarea, select { transition: all 0.2s; }
        input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 2px #d4af37; border-color: #d4af37; }
        .dropdown-menu { transform-origin: top; animation: dropIn 0.15s ease-out; }
        @keyframes dropIn { from { opacity: 0; transform: scaleY(0.95) translateY(-4px); } to { opacity: 1; transform: scaleY(1) translateY(0); } }
        .blink { animation: blinkAnim 1s step-start infinite; }
        @keyframes blinkAnim { 50% { opacity: 0.15; } }
        .drag-over { outline: 2px dashed #d4af37; outline-offset: -6px; background: rgba(212, 175, 55, 0.08); }
        .dragging { opacity: 0.4; }
        .pipeline-scroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: auto; scrollbar-color: #d4af37 #e2e8f0; }
        .pipeline-scroll::-webkit-scrollbar { height: 18px; }
        .pipeline-scroll::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 999px; }
        .pipeline-scroll::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #f59e0b, #d4af37); border-radius: 999px; border: 4px solid #e2e8f0; min-width: 90px; }
        .pipeline-scroll::-webkit-scrollbar-thumb:hover { background: linear-gradient(90deg, #d97706, #b48a22); }
    </style>
</head>
<body class="text-slate-800 h-screen overflow-hidden">
    <div id="app">
        <div class="flex items-center justify-center h-screen bg-slate-50">
            <div class="text-center">
                <div class="animate-pulse flex flex-col items-center gap-4">
                    <div class="w-12 h-12 bg-slate-200 rounded-xl"></div>
                    <div class="h-4 w-48 bg-slate-200 rounded"></div>
                    <p class="text-xs text-slate-400">Загрузка...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="./firebase-app.js" onerror="window.__fbLoadErr='firebase-app.js не найден или битый'"></script>
    <script src="./firebase-firestore.js" onerror="window.__fbLoadErr='firebase-firestore.js не найден или битый'"></script>
    <script src="./firebase-auth.js" onerror="window.__fbLoadErr='firebase-auth.js не найден или битый'"></script>

    <script>
        window.__crmBooted = false;
        window.__lastError = '';
        window.onerror = function (msg, source, lineno) {
            window.__lastError = msg + ' (строка ' + lineno + ')';
            showBootError(window.__lastError, false);
            return false;
        };
        function showBootError(text, isWatchdog) {
            var box = document.getElementById('boot-error');
            if (!box) {
                box = document.createElement('div');
                box.id = 'boot-error';
                box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#fee2e2;color:#991b1b;padding:14px 16px;font-size:13px;z-index:99999;border-top:2px solid #ef4444;line-height:1.5;';
                document.body.appendChild(box);
            }
            var hint = isWatchdog
                ? 'Скрипт CRM не запустился. Чаще всего это потерянная запятая при правке карандашом в GitHub. Залей index.html заново через Add file - Upload files.'
                : 'Ошибка выполнения скрипта:';
            box.innerHTML = '<b>Не удалось загрузить CRM.</b><br>' + hint + (text ? '<br><br><code style="background:#fff;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:6px;word-break:break-all;">' + String(text).replace(/</g, '&lt;') + '</code>' : '');
        }
        setTimeout(function () {
            if (window.__crmBooted !== true) showBootError(window.__lastError || window.__fbLoadErr || '', true);
        }, 6000);
    </script>

    <script>
        window.__crmBooted = true;

        var db = null, auth = null, firebaseReady = false;
        try {
            if (typeof firebase !== 'undefined') {
                var firebaseConfig = {
                    apiKey: "AIzaSyCZS2M_KVwsHYfZIxuQRFH_y1UtTz30YB0",
                    authDomain: "new-crm-c3637.firebaseapp.com",
                    projectId: "new-crm-c3637",
                    storageBucket: "new-crm-c3637.firebasestorage.app",
                    messagingSenderId: "683210584418",
                    appId: "1:683210584418:web:c202cef4c7b8b09bb97c3b"
                };
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();

        var STAGES = [
            { id: 'new', name: 'Новый лид', cardBg: 'bg-slate-50', cardBorder: 'border-slate-400', cardText: 'text-slate-800', headerBg: 'bg-slate-100' },
            { id: 'contacted', name: 'Созвонились, инфо направлено', cardBg: 'bg-blue-50', cardBorder: 'border-blue-400', cardText: 'text-blue-900', headerBg: 'bg-blue-100' },
            { id: 'meeting1', name: '1 встреча назначена', cardBg: 'bg-indigo-50', cardBorder: 'border-indigo-400', cardText: 'text-indigo-900', headerBg: 'bg-indigo-100' },
            { id: 'approval', name: 'Согласование', cardBg: 'bg-violet-50', cardBorder: 'border-violet-400', cardText: 'text-violet-900', headerBg: 'bg-violet-100' },
            { id: 'memo_sent', name: 'Меморандум отправлен', cardBg: 'bg-purple-50', cardBorder: 'border-purple-400', cardText: 'text-purple-900', headerBg: 'bg-purple-100' },
            { id: 'meeting2', name: '2 встреча назначена', cardBg: 'bg-fuchsia-50', cardBorder: 'border-fuchsia-400', cardText: 'text-fuchsia-900', headerBg: 'bg-fuchsia-100' },
            { id: 'memo_filled', name: 'Меморандум заполнен', cardBg: 'bg-pink-50', cardBorder: 'border-pink-400', cardText: 'text-pink-900', headerBg: 'bg-pink-100' },
            { id: 'investor_meeting', name: 'Встреча с инвестором', cardBg: 'bg-rose-50', cardBorder: 'border-rose-400', cardText: 'text-rose-900', headerBg: 'bg-rose-100' },
            { id: 'contract', name: 'Подписан договор, Invoice', cardBg: 'bg-orange-50', cardBorder: 'border-orange-400', cardText: 'text-orange-900', headerBg: 'bg-orange-100' },
            { id: 'audit', name: 'Этап проведения аудита', cardBg: 'bg-amber-50', cardBorder: 'border-amber-400', cardText: 'text-amber-900', headerBg: 'bg-amber-100' },
            { id: 'funded', name: 'Инвестиции получены', cardBg: 'bg-emerald-50', cardBorder: 'border-emerald-400', cardText: 'text-emerald-900', headerBg: 'bg-emerald-100' },
            { id: 'failed', name: 'Факап - сделка провалена', cardBg: 'bg-red-50', cardBorder: 'border-red-400', cardText: 'text-red-900', headerBg: 'bg-red-100' }
        ];

        var USERS = [
            { email: 'damned13@list.ru',             firstName: 'Денис',     lastName: 'Алёхин' },
            { email: 'shilov60igor@yandex.ru',       firstName: 'Игорь',     lastName: 'Шилов' },
            { email: '8888.ignatov@gmail.com',       firstName: 'Александр', lastName: 'Игнатов' },
            { email: 'igor.gordeev.196@mail.ru',     firstName: 'Игорь',     lastName: 'Гордеев' },
            { email: 'Irinataranenko2016@gmail.com', firstName: 'Ирина',     lastName: 'Тараненко' }
        ];

        var ADMIN_EMAILS = ['damned13@list.ru'];

        var MONTH_NAMES = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        var WEEK_DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

        var state = {
            currentUser: null, deals: [], view: 'pipeline',
            modalOpen: false, modalReadOnly: false, selectedDealId: null, newDealStage: null,
            firebaseConnected: false, dbError: '', authLoading: true, loginError: '',
            calYear: new Date().getFullYear(), calMonth: new Date().getMonth(), selectedDate: null,
            dealFiles: [], uploadingName: null, taskPopup: null, analyticsScope: 'all'
        };

        function formatMoney(a) { return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(a || 0); }
        function formatDate(s) { if (!s) return ''; return new Date(s).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
        function pad2(n) { return n < 10 ? '0' + n : '' + n; }
        function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
        function dateKeyOf(s) { return dateKey(new Date(s)); }
        function timeOf(s) { if (!s) return ''; var d = new Date(s); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
        function toLocalInputValue(s) { if (!s) return ''; var d = new Date(s); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
        function formatSize(b) { if (!b && b !== 0) return ''; if (b < 1024) return b + ' Б'; if (b < 1048576) return Math.round(b / 1024) + ' КБ'; return (b / 1048576).toFixed(1) + ' МБ'; }
        function findDeal(id) { return state.deals.find(function (d) { return d.id === id; }) || null; }
        function labelForUid(uid) { var me = state.currentUser; if (me && me.uid === uid) return me.lastName + ' ' + me.firstName; return 'Партнёр'; }
        function initialsForUid(uid) { var me = state.currentUser; if (me && me.uid === uid) return me.firstName[0] + (me.lastName ? me.lastName[0] : ''); return '?'; }
        function isOwner(deal) { return !deal || deal.ownerUid === state.currentUser.uid; }
        function isMine(deal) { if (!state.currentUser) return false; var u = state.currentUser.uid; return deal.ownerUid === u || deal.responsibleUid === u; }
        function isAdminClient() { if (!state.currentUser) return false; return ADMIN_EMAILS.map(function (e) { return e.toLowerCase(); }).indexOf(state.currentUser.email.toLowerCase()) !== -1; }
        function isOverdue(t) { return t && t.date && !t.done && new Date(t.date).getTime() < Date.now(); }
        function dealTaskStatus(deal) { var open = (deal.tasks || []).filter(function (t) { return !t.done; }); if (open.some(isOverdue)) return 'overdue'; if (open.length) return 'active'; return 'none'; }
        function getMyTasks() { var l = []; state.deals.forEach(function (d) { if (!isMine(d)) return; (d.tasks || []).forEach(function (t, i) { l.push({ deal: d, task: t, index: i }); }); }); return l; }
        function getMyDeals() { return state.deals.filter(isMine); }
        function getAnalyticsDeals() { if (state.analyticsScope === 'mine' || !isAdminClient()) return state.deals.filter(isMine); return state.deals; }
        function stageOptionsHtml(sel) { return STAGES.map(function (s) { return '<option value="' + s.id + '"' + (s.id === sel ? ' selected' : '') + '>' + s.name + '</option>'; }).join(''); }

        // ====== ПОДПИСКИ: админ - вся коллекция, партнёр - только свои ======
        var dealUnsubs = [];
        var dealSets = {};
        function clearDealSubs() { dealUnsubs.forEach(function (u) { try { u(); } catch (e) {} }); dealUnsubs = []; dealSets = {}; }

        function mergeAndRender() {
            var merged = {};
            Object.keys(dealSets).forEach(function (k) { Object.keys(dealSets[k]).forEach(function (id) { merged[id] = dealSets[k][id]; }); });
            var arr = Object.keys(merged).map(function (id) { return merged[id]; });
            arr.sort(function (a, b) { return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); });
            state.deals = arr;
            state.firebaseConnected = true;
            state.dbError = '';
            render();
        }
        function onDbError(error) {
            console.error('Firestore:', error);
            state.firebaseConnected = false;
            state.dbError = (error && error.code ? error.code + ' — ' : '') + (error && error.message ? error.message : String(error));
            render();
        }
        function attachQuery(q, key) {
            var u = q.onSnapshot(function (snap) {
                var m = {};
                snap.docs.forEach(function (d) { var o = d.data(); o.id = d.id; m[d.id] = o; });
                dealSets[key] = m;
                mergeAndRender();
            }, onDbError);
            dealUnsubs.push(u);
        }
        function subscribeToDeals() {
            if (!db || !state.currentUser) return;
            clearDealSubs();
            if (isAdminClient()) {
                attachQuery(db.collection('deals'), 'all');
            } else {
                var uid = state.currentUser.uid;
                attachQuery(db.collection('deals').where('ownerUid', '==', uid), 'own');
                attachQuery(db.collection('deals').where('responsibleUid', '==', uid), 'resp');
            }
        }

        function saveDealToDB(data) {
            if (!db) { alert('База недоступна'); return; }
            var payload = Object.assign({}, data, { createdAt: new Date().toISOString() });
            db.collection('deals').add(payload).then(function () {
                if (!isAdminClient()) setTimeout(function () { subscribeToDeals(); }, 400);
            }).catch(function (e) { alert('Ошибка сохранения: ' + e.message); });
        }
        function updateDealInDB(id, data) { if (!db) return; db.collection('deals').doc(id).update(data).catch(function (e) { console.error(e); alert('Ошибка записи: ' + e.message); }); }
        function deleteDealFromDB(id) { if (!db) return; db.collection('deals').doc(id).delete().catch(function (e) { console.error(e); }); }

        // ====== ФАЙЛЫ: подколлекции сделки ======
        function filesCol(dealId) { return db.collection('deals').doc(dealId).collection('files'); }
        function chunksCol(dealId) { return db.collection('deals').doc(dealId).collection('chunks'); }

        function loadFiles(dealId) {
            state.dealFiles = []; state.uploadingName = null;
            if (!db || !dealId) return;
            filesCol(dealId).get().then(function (snap) {
                state.dealFiles = snap.docs.map(function (d) { var o = d.data(); o.id = d.id; return o; });
                state.uploadingName = null;
                if (state.modalOpen) renderModal();
            }).catch(function (e) { console.error(e); state.uploadingName = null; });
        }

        window.handleFileUpload = function (input) {
            if (state.modalReadOnly) return;
            if (!input.files || !input.files[0] || !state.selectedDealId) return;
            var deal = findDeal(state.selectedDealId);
            if (!deal || deal.ownerUid !== state.currentUser.uid) { alert('Редактировать чужие сделки запрещено'); return; }
            var file = input.files[0];
            if (!db) { alert('Нет подключения к БД'); return; }
            if (file.size > 20 * 1024 * 1024) { alert('Файл больше 20 МБ. Используй «Прикрепить ссылку».'); return; }
            var dealId = state.selectedDealId;
            state.uploadingName = file.name; renderModal();
            var reader = new FileReader();
            reader.onload = function () {
                try {
                    var base64 = String(reader.result).split(',')[1];
                    var CHUNK = 700000, chunks = [];
                    for (var i = 0; i < base64.length; i += CHUNK) chunks.push(base64.substr(i, CHUNK));
                    filesCol(dealId).add({ dealId: dealId, name: file.name, size: file.size, type: file.type || '', chunkCount: chunks.length, external: false, createdAt: new Date().toISOString() })
                        .then(function (ref) {
                            return Promise.all(chunks.map(function (c, idx) { return chunksCol(dealId).add({ fileId: ref.id, index: idx, data: c }); }));
                        })
                        .then(function () { loadFiles(dealId); })
                        .catch(function (err) { state.uploadingName = null; alert('Ошибка: ' + (err && err.message ? err.message : err)); renderModal(); });
                } catch (e) { state.uploadingName = null; alert('Не удалось прочитать файл'); renderModal(); }
            };
            reader.onerror = function () { state.uploadingName = null; alert('Ошибка чтения'); renderModal(); };
            reader.readAsDataURL(file);
        };

        window.openFile = function (fileId) {
            var f = null;
            for (var i = 0; i < state.dealFiles.length; i++) if (state.dealFiles[i].id === fileId) f = state.dealFiles[i];
            if (!f) return;
            if (f.url) { window.open(f.url, '_blank'); return; }
            var dealId = state.selectedDealId;
            if (!db || !dealId) return;
            chunksCol(dealId).where('fileId', '==', fileId).get().then(function (snap) {
                var chunks = snap.docs.map(function (d) { return d.data(); });
                chunks.sort(function (a, b) { return a.index - b.index; });
                var b64 = ''; chunks.forEach(function (c) { b64 += c.data || ''; });
                var bin = atob(b64), arr = new Uint8Array(bin.length);
                for (var j = 0; j < bin.length; j++) arr[j] = bin.charCodeAt(j);
                var blob = new Blob([arr], { type: f.type || 'application/octet-stream' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a'); a.href = url; a.download = f.name || 'file';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            }).catch(function (e) { alert('Не удалось открыть файл: ' + e.message); });
        };

        window.deleteFileDoc = function (fileId) {
            if (state.modalReadOnly) return;
            if (!confirm('Удалить файл?')) return;
            var deal = findDeal(state.selectedDealId);
            if (!deal || deal.ownerUid !== state.currentUser.uid) { alert('Удалять файлы в чужих сделках запрещено'); return; }
            var dealId = state.selectedDealId;
            chunksCol(dealId).where('fileId', '==', fileId).get().then(function (snap) {
                var batch = db.batch();
                snap.docs.forEach(function (d) { batch.delete(d.ref); });
                batch.delete(filesCol(dealId).doc(fileId));
                return batch.commit();
            }).then(function () { loadFiles(dealId); }).catch(function (e) { alert('Ошибка удаления: ' + e.message); });
        };

        window.attachLink = function () {
            if (state.modalReadOnly) return;
            var deal = findDeal(state.selectedDealId);
            if (!deal || deal.ownerUid !== state.currentUser.uid) { alert('Прикреплять ссылки в чужих сделках запрещено'); return; }
            var url = prompt('Вставьте ссылку на файл:'); if (!url || !url.trim()) return;
            var name = prompt('Название файла:', 'Внешний файл'); if (name === null) return;
            var dealId = state.selectedDealId;
            filesCol(dealId).add({ dealId: dealId, name: name.trim() || 'Внешний файл', size: 0, type: '', chunkCount: 0, external: true, url: url.trim(), createdAt: new Date().toISOString() })
                .then(function () { loadFiles(dealId); }).catch(function (e) { alert('Ошибка: ' + e.message); });
        };

        // ====== AUTH ======
        window.doLogin = function () {
            if (!auth) { setLoginError('Firebase Auth не подключён'); return; }
            var e = document.getElementById('login-email'), p = document.getElementById('login-pass');
            if (!e || !p) return;
            var email = e.value.trim(), pass = p.value;
            if (!email || !pass) { setLoginError('Введите email и пароль'); return; }
            setLoginError('');
            var btn = document.getElementById('login-submit');
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Вход...'; }
            auth.signInWithEmailAndPassword(email, pass).catch(function (err) {
                var c = err && err.code ? err.code : '', msg = 'Неверный email или пароль';
                if (c === 'auth/too-many-requests') msg = 'Слишком много попыток. Подожди минуту.';
                else if (c === 'auth/network-request-failed') msg = 'Нет связи с сервером авторизации';
                setLoginError(msg);
                if (btn) { btn.disabled = false; btn.innerHTML = '<span>Войти в систему</span><i class="fa-solid fa-arrow-right"></i>'; }
            });
        };
        window.doLogout = function () { clearDealSubs(); if (auth) auth.signOut(); };
        window.doReset = function () {
            if (!auth) return;
            var e = document.getElementById('login-email'), email = e ? e.value.trim() : '';
            if (!email) { setLoginError('Сначала введи email'); return; }
            auth.sendPasswordResetEmail(email).then(function () { setLoginError(''); alert('Ссылка для сброса отправлена на ' + email); }).catch(function (err) { setLoginError('Не удалось отправить: ' + err.message); });
        };
        function setLoginError(m) { state.loginError = m || ''; var b = document.getElementById('login-error'); if (b) { b.textContent = state.loginError; b.style.display = state.loginError ? 'block' : 'none'; } }

        function onAuthStateChanged(user) {
            state.authLoading = false;
            if (user) {
                var email = (user.email || '').toLowerCase();
                var p = USERS.find(function (u) { return u.email.toLowerCase() === email; });
                state.currentUser = { uid: user.uid, email: user.email || '', firstName: p ? p.firstName : 'Пользователь', lastName: p ? p.lastName : '' };
                subscribeToDeals();
            } else {
                clearDealSubs();
                state.currentUser = null; state.deals = []; state.modalOpen = false; state.modalReadOnly = false;
                state.selectedDealId = null; state.taskPopup = null; state.firebaseConnected = false; state.dbError = '';
                var mr = document.getElementById('modal-root'); if (mr) mr.remove();
                var pr = document.getElementById('task-popup-root'); if (pr) pr.remove();
            }
            render();
        }

        function renderLogin() {
            var err = '<div id="login-error" style="display:' + (state.loginError ? 'block' : 'none') + '" class="mt-3 text-xs font-semibold text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2">' + (state.loginError || '') + '</div>';

            var delBtn = (!isNew && owner) ? '<button onclick="window.deleteDeal(\'' + deal.id + '\')" class="text-red-500 hover:bg-red-50 px-3 py-2 rounded-lg text-sm font-medium"><i class="fa-solid fa-trash mr-1"></i><span class="hidden sm:inline">Удалить</span></button>' : '<div></div>';
            var saveBtn = owner ? '<button onclick="window.saveDeal()" class="px-4 md:px-5 py-2 rounded-lg bg-slate-900 text-white text-sm font-medium shadow-md"><i class="fa-solid fa-check mr-1"></i>' + (isNew ? 'Создать' : 'Сохранить') + '</button>' : '';
            var html = '<div class="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-slate-900/60 backdrop-blur-sm p-0 md:p-4 fade-in" onclick="if(event.target===this) window.closeDealModal()"><div class="bg-white rounded-t-2xl md:rounded-2xl shadow-2xl w-full max-w-4xl h-[90vh] md:h-auto md:max-h-[90vh] flex flex-col overflow-hidden"><div class="px-4 md:px-8 py-4 md:py-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50 flex-shrink-0"><div class="flex items-center gap-3 min-w-0"><div class="w-10 h-10 md:w-12 md:h-12 rounded-xl ' + (isNew ? 'bg-slate-200 border-slate-400' : sObj.cardBg + ' ' + sObj.cardBorder) + ' flex items-center justify-center flex-shrink-0 border-l-4"><i class="fa-solid ' + (isNew ? 'fa-plus' : 'fa-building') + ' text-slate-600 text-lg"></i></div><div class="min-w-0"><h2 class="text-lg md:text-xl font-bold text-slate-900 truncate">' + (isNew ? 'Новая сделка' : (deal.businessName || deal.title)) + '</h2><div class="flex items-center gap-2 mt-1 flex-wrap">' + badge + '<span class="text-xs text-slate-400">Владелец: ' + (isNew ? state.currentUser.firstName + ' ' + state.currentUser.lastName : labelForUid(deal.ownerUid)) + '</span></div><div class="mt-2 flex items-center gap-2"><span class="text-[10px] font-bold text-slate-500 uppercase">Этап</span><select id="m_stage" ' + dis + ' class="text-xs px-2 py-1 rounded-lg border ' + sObj.cardBorder + ' ' + sObj.headerBg + ' font-semibold max-w-[260px]">' + stageOptionsHtml(stage) + '</select></div></div></div><button onclick="window.closeDealModal()" class="w-8 h-8 rounded-lg hover:bg-slate-200 flex items-center justify-center text-slate-400 flex-shrink-0 ml-2"><i class="fa-solid fa-xmark text-lg"></i></button></div><div class="flex-1 overflow-y-auto custom-scroll p-4 md:p-8"><div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8"><div class="lg:col-span-2 space-y-6"><div class="space-y-4"><h3 class="text-sm font-bold text-slate-900 uppercase border-b border-slate-100 pb-2">Основная информация</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="md:col-span-2"><label class="block text-xs font-semibold text-slate-500 mb-1">Название компании *</label><input type="text" id="m_businessName" value="' + bn + '" ' + dis + ' class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 disabled:opacity-50" placeholder="ООО Ромашка"></div><div class="md:col-span-2 relative"><label class="block text-xs font-semibold text-slate-500 mb-1">Ответственный</label><button type="button" id="resp-dropdown-btn" onclick="window.toggleDropdown()" ' + dis + ' class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-left flex items-center justify-between disabled:opacity-50"><span id="resp-dropdown-label">' + (ru ? labelForUid(ru) : '<span class="text-slate-400">Не назначен</span>') + '</span><i class="fa-solid fa-chevron-down text-slate-400 text-xs"></i></button><div id="resp-dropdown-menu" class="hidden absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-20 dropdown-menu">' + respOpts + '</div></div><div class="md:col-span-2"><label class="block text-xs font-semibold text-slate-500 mb-1">Описание бизнеса</label><textarea id="m_businessDescription" rows="3" ' + dis + ' class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 disabled:opacity-50">' + bd + '</textarea></div><div class="md:col-span-2"><label class="block text-xs font-semibold text-slate-500 mb-1">Сумма инвестиций (EUR) *</label><input type="number" id="m_investmentAmount" value="' + ia + '" ' + dis + ' class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 disabled:opacity-50" placeholder="1000000"></div></div></div><div class="space-y-4"><div class="flex items-center justify-between border-b border-slate-100 pb-2"><h3 class="text-sm font-bold text-slate-900 uppercase">Контакты</h3>' + (owner ? '<button onclick="window.addContactRow()" class="text-xs font-semibold text-amber-600"><i class="fa-solid fa-plus mr-1"></i>Добавить</button>' : '') + '</div><div id="contactsContainer" class="space-y-3"></div></div><div class="space-y-4"><h3 class="text-sm font-bold text-slate-900 uppercase border-b border-slate-100 pb-2">Комментарии</h3><div class="space-y-3 max-h-48 overflow-y-auto custom-scroll pr-2">' + commentsHtml + (comments.length ? '' : '<p class="text-xs text-slate-400 italic">Нет комментариев</p>') + '</div>' + commentForm + '</div></div><div class="space-y-6"><div class="space-y-4"><h3 class="text-sm font-bold text-slate-900 uppercase border-b border-slate-100 pb-2">Задачи</h3><div class="space-y-2 max-h-64 overflow-y-auto custom-scroll">' + tasksHtml + (tasks.length ? '' : '<p class="text-xs text-slate-400 italic">Нет задач</p>') + '</div>' + taskForm + '</div><div class="space-y-4"><h3 class="text-sm font-bold text-slate-900 uppercase border-b border-slate-100 pb-2">Файлы</h3><div class="space-y-2 max-h-48 overflow-y-auto custom-scroll">' + upl + filesHtml + (files.length || state.uploadingName ? '' : '<p class="text-xs text-slate-400 italic">Нет файлов</p>') + '</div>' + fileZone + (isNew ? '<p class="text-[10px] text-slate-400 italic">Файлы можно прикрепить после создания сделки</p>' : '') + '</div></div></div></div><div class="px-4 md:px-8 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between flex-shrink-0 gap-4">' + delBtn + '<div class="flex gap-3 ml-auto"><button onclick="window.closeDealModal()" class="px-4 md:px-5 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium">Закрыть</button>' + saveBtn + '</div></div></div></div>';
            var ex = document.getElementById('modal-root'); if (ex) ex.remove();
            var div = document.createElement('div'); div.id = 'modal-root'; div.innerHTML = html; document.body.appendChild(div);
            document.removeEventListener('click', window.closeDropdownOnOutside);
            document.addEventListener('click', window.closeDropdownOnOutside);
            refreshContactsInModal();
        }

        function renderContactRow(c, i, owner) {
            var dis = owner ? '' : 'disabled';
            var del = owner ? '<button onclick="window.removeContact(' + i + ')" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash text-xs"></i></button>' : '';
            return '<div class="bg-slate-50 rounded-lg p-3 border border-slate-100 space-y-2"><div class="flex items-center justify-between"><span class="text-[10px] font-bold text-slate-400 uppercase">Контакт #' + (i + 1) + '</span>' + del + '</div><input type="text" id="c_name_' + i + '" value="' + (c.name || '') + '" ' + dis + ' placeholder="ФИО" class="w-full px-2 py-1.5 rounded border border-slate-200 bg-white text-xs disabled:bg-slate-100"><div class="grid grid-cols-2 gap-2"><input type="text" id="c_phone_' + i + '" value="' + (c.phone || '') + '" ' + dis + ' placeholder="Телефон" class="w-full px-2 py-1.5 rounded border border-slate-200 bg-white text-xs disabled:bg-slate-100"><input type="email" id="c_email_' + i + '" value="' + (c.email || '') + '" ' + dis + ' placeholder="Email" class="w-full px-2 py-1.5 rounded border border-slate-200 bg-white text-xs disabled:bg-slate-100"><input type="text" id="c_telegram_' + i + '" value="' + (c.telegram || '') + '" ' + dis + ' placeholder="Telegram" class="w-full px-2 py-1.5 rounded border border-slate-200 bg-white text-xs disabled:bg-slate-100"><input type="text" id="c_max_' + i + '" value="' + (c.max || '') + '" ' + dis + ' placeholder="MAX" class="w-full px-2 py-1.5 rounded border border-slate-200 bg-white text-xs disabled:bg-slate-100"></div></div>';
        }
        function refreshContactsInModal() { var c = document.getElementById('contactsContainer'); if (!c) return; var d = state.selectedDealId ? findDeal(state.selectedDealId) : null; var o = !state.modalReadOnly && (!d || d.ownerUid === state.currentUser.uid); c.innerHTML = window.tempContacts.map(function (x, i) { return renderContactRow(x, i, o); }).join(''); }
        window.addContactRow = function () { if (state.modalReadOnly) return; window.tempContacts.push({ name: '', phone: '', email: '', telegram: '', max: '' }); refreshContactsInModal(); };
        window.removeContact = function (i) { if (state.modalReadOnly) return; window.tempContacts.splice(i, 1); refreshContactsInModal(); };
        window.addComment = function () { if (state.modalReadOnly) return; var i = document.getElementById('m_comment'); if (!i || !i.value.trim()) return; var d = findDeal(state.selectedDealId); if (!d || d.ownerUid !== state.currentUser.uid) return; d.comments.push({ text: i.value.trim(), date: new Date().toISOString(), author: state.currentUser.lastName + ' ' + state.currentUser.firstName }); updateDealInDB(d.id, { comments: d.comments }); renderModal(); };
        window.addTask = function () { if (state.modalReadOnly) return; var t = document.getElementById('m_task_text'), dt = document.getElementById('m_task_date'); if (!t || !t.value.trim()) return; var d = findDeal(state.selectedDealId); if (!d || d.ownerUid !== state.currentUser.uid) return; d.tasks.push({ text: t.value.trim(), done: false, date: dt && dt.value ? new Date(dt.value).toISOString() : new Date().toISOString() }); updateDealInDB(d.id, { tasks: d.tasks }); renderModal(); };
        window.toggleTask = function (i) { if (state.modalReadOnly) return; var d = findDeal(state.selectedDealId); if (!d || !d.tasks[i] || d.ownerUid !== state.currentUser.uid) return; d.tasks[i].done = !d.tasks[i].done; updateDealInDB(d.id, { tasks: d.tasks }); renderModal(); };
        window.deleteTask = function (i) { if (state.modalReadOnly) return; var d = findDeal(state.selectedDealId); if (!d || !d.tasks || d.ownerUid !== state.currentUser.uid) return; d.tasks.splice(i, 1); updateDealInDB(d.id, { tasks: d.tasks }); renderModal(); };

        window.saveDeal = function () {
            if (state.modalReadOnly) return;
            var bnE = document.getElementById('m_businessName'), iaE = document.getElementById('m_investmentAmount'), sE = document.getElementById('m_stage'), bdE = document.getElementById('m_businessDescription');
            if (!bnE || !iaE || !sE) return;
            var bn = bnE.value.trim(), ia = parseFloat(iaE.value), stage = sE.value, bd = bdE ? bdE.value.trim() : '';
            var ru = window.selectedRespManagerUid || '';
            if (!bn || isNaN(ia) || ia <= 0) { alert('Заполните название компании и сумму инвестиций'); return; }
            var contacts = window.tempContacts.map(function (_, i) {
                function v(id) { var e = document.getElementById(id); return e ? e.value : ''; }
                return { name: v('c_name_' + i), phone: v('c_phone_' + i), email: v('c_email_' + i), telegram: v('c_telegram_' + i), max: v('c_max_' + i) };
            }).filter(function (c) { return c.name || c.phone || c.email; });
            if (state.selectedDealId) {
                var d = findDeal(state.selectedDealId);
                if (!d || d.ownerUid !== state.currentUser.uid) { alert('Редактировать чужие сделки запрещено'); return; }
                updateDealInDB(state.selectedDealId, { businessName: bn, title: bn, businessDescription: bd, investmentAmount: ia, responsibleUid: ru, stage: stage, contacts: contacts });
            } else {
                saveDealToDB({ title: bn, businessName: bn, businessDescription: bd, investmentAmount: ia, stage: stage, ownerUid: state.currentUser.uid, ownerEmail: state.currentUser.email, responsibleUid: ru, contacts: contacts, comments: [], tasks: [] });
            }
            window.closeDealModal();
        };

        window.deleteDeal = function (id) {
            if (state.modalReadOnly) return;
            if (!confirm('Удалить сделку?')) return;
            var d = findDeal(id);
            if (!d || d.ownerUid !== state.currentUser.uid) { alert('Удалять чужие сделки запрещено'); return; }
            deleteDealFromDB(id);
            var m = document.getElementById('modal-root'); if (m) m.remove();
            state.modalOpen = false; state.selectedDealId = null;
            render();
        };

        function initApp() {
            if (!firebaseReady || !auth) { state.authLoading = false; render(); return; }
            auth.onAuthStateChanged(onAuthStateChanged);
        }
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
